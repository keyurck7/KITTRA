# Training distribution for Phase 2: domain randomization + sensor and actuator models.
# Ranges are educated guesses for a hobby-grade servo arm with USB cameras.
# Phase 3 replaces them with values measured on the real SO-101 (system identification).
name: randomized
task:
  n_distractors: 2
  max_episode_steps: 300
  reward: sparse
physics:
  enabled: true
  friction: [0.5, 1.5]
  mass: [0.7, 1.3]
  damping: [0.8, 1.2]
  kp: [0.85, 1.15]
visual:
  enabled: true
  light_pos_offset: 0.3
  light_intensity: [0.6, 1.4]
  color_jitter: 0.2
  target_color_jitter: 0.1
  cam_pos_offset: 0.015
  cam_rot_deg: 3.0
sensor:
  enabled: true
  joint_sigma: 0.005
  joint_bias: 0.01
  img_sigma: 8.0
  blur_p: 0.3
  blur_max_kernel: 5
  brightness: 0.2
  contrast: 0.2
actuator:
  enabled: true
  min_delay_steps: 0
  max_delay_steps: 3
  backlash: 0.01
