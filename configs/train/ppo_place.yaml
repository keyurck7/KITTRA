# PPO for the KittraPlace-v0 placement skill (Stable-Baselines3).
env_config: randomized       # train under domain randomization + sensor/actuator models
eval_config: randomized
n_envs: 8
total_timesteps: 3000000
seed: 0
ppo:
  n_steps: 1024              # per env -> 8192 samples per update
  batch_size: 256
  n_epochs: 10
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
policy_kwargs:
  net_arch: [256, 256]
eval:
  freq: 25000                # total env steps between evaluations
  n_episodes: 50
