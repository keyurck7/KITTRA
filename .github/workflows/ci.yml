name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python tests (MuJoCo, headless)
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless rendering
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 libgl1
      - name: Install
        run: |
          pip install -r requirements-sim.txt
          pip install -e .
      - name: Fast tests
        run: pytest -m "not slow" -v
      - name: Slow tests (scripted experts)
        run: pytest -m slow -v
      - name: Expert smoke run
        run: python scripts/run_expert.py --episodes 5 --config randomized

  ros2:
    name: ROS 2 Jazzy build + bridge smoke test
    runs-on: ubuntu-24.04
    container: osrf/ros:jazzy-desktop
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies (venv, same as the laptop setup)
        run: |
          apt-get update && apt-get install -y python3-venv python3-pip python3-colcon-common-extensions libosmesa6
          python3 -m venv /opt/venv --system-site-packages
          /opt/venv/bin/pip install -U pip
          /opt/venv/bin/pip install -c constraints-ubuntu24.txt -r requirements-sim.txt
          /opt/venv/bin/pip install -c constraints-ubuntu24.txt -e .
      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          source /opt/venv/bin/activate
          cd ros2_ws && python -m colcon build --symlink-install
          head -1 install/kittra_bridge/lib/kittra_bridge/mujoco_bridge
      - name: Bridge publishes joint states
        run: |
          source /opt/ros/jazzy/setup.bash
          source /opt/venv/bin/activate
          source ros2_ws/install/setup.bash
          ros2 launch kittra_bringup sim.launch.py rviz:=false publish_images:=false autopilot:=expert &
          LAUNCH_PID=$!
          # Wait (up to 90 s) for the bridge to start publishing instead of a fixed sleep.
          for i in $(seq 1 45); do
            ros2 topic list 2>/dev/null | grep -q '^/kittra/scene_markers$' && break
            sleep 2
          done
          timeout 30 ros2 topic echo --once /joint_states sensor_msgs/msg/JointState
          timeout 30 ros2 topic echo --once /kittra/scene_markers visualization_msgs/msg/MarkerArray > /dev/null
          kill $LAUNCH_PID
